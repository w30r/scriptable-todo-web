<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meor todo list</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- THESIS: Second Brain, restyled as a single-column obsidian app: a pastel gradient hero banner with a scooped notch, capsule status filters, pastel Eisenhower quadrant cards with live progress bars, and a floating glass dock. It refuses the old flat-dark dashboard grammar and the browser-tab strip; the surface reads as a handheld companion even on desktop.
OWN-WORLD: deep obsidian #0d0d0f ground; pastel mint/teal/sky gradient banner with dark charcoal ink; four pastel-tinted quadrant cards (coral/mint/sky/lavender) carrying dark text; squircle radii 24-32px; glass dock with backdrop blur; bright green progress fills on dark tracks; stroke-drawn SVG icons, system SF stack.
STORY: one glance shows how many tasks are live this month, which quadrant to attack first, and how complete each is; the dock makes every destination one thumb away.
FIRST VIEWPORT: greeting + avatar up top, dark headline with a live task count, level/xp pill bottom-left, a dark stats button nested in the banner notch bottom-right, then three tall filter capsules and the four pastel quadrant cards.
FORM: pinned user brief (pastel obsidian companion), replacing the prior dark-dashboard identity.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md -->
    <div class="container">
      <header class="hero-banner">
        <div class="hero-inner">
          <div class="hero-pattern" aria-hidden="true"></div>
          <div class="hero-top">
            <p class="hero-greeting">Hello, Meor 👋</p>
            <div class="hero-avatar" aria-hidden="true">M</div>
          </div>
          <h1 class="hero-headline">You Have <span id="month-count">0</span> Tasks in This Month</h1>
          <div class="hero-footer">
            <div id="rpg-badge" class="rpg-badge">
              <span class="rpg-level">Lv. 1</span>
              <div class="rpg-xp-bar"><div class="rpg-xp-fill" style="width:0%"></div></div>
              <span class="rpg-streak"></span>
            </div>
            <button id="stats-btn" class="hero-notch-btn" aria-label="View stats">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 20v-6M10 20V6M16 20v-9M20 20H4" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="pomodoro-bar">
        <span id="pomo-icon">⏱</span>
        <span id="pomo-time">25:00</span>
        <button id="pomo-start" class="pomo-btn" aria-label="Start pomodoro">▶</button>
        <button id="pomo-reset" class="pomo-btn" aria-label="Reset pomodoro">⟳</button>
        <span id="pomo-sessions"></span>
      </div>

      <div id="todo-section">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">
            <span class="filter-icon icon-yellow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L8 4M3.5 12l1.5 1.5L8 10M3.5 18l1.5 1.5L8 16"/></svg>
            </span>
            <span class="filter-label">All</span>
          </button>
          <button class="filter-btn" data-filter="active">
            <span class="filter-icon icon-mint" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
            </span>
            <span class="filter-label">Active</span>
          </button>
          <button class="filter-btn" data-filter="completed">
            <span class="filter-icon icon-pink" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>
            </span>
            <span class="filter-label">Completed</span>
          </button>
        </div>

        <input type="text" id="todo-search" class="search-input" placeholder="Search todos..." aria-label="Search todos" />

        <div id="matrix" class="matrix">
          <div class="loading">Loading todos...</div>
        </div>

        <div class="stats">
          <span id="todo-count">0 items left</span>
          <span id="today-count"></span>
          <button id="clear-completed" class="clear-btn">Clear completed</button>
        </div>
      </div>

      <div id="shopping-section" style="display: none">
        <form id="shop-form" class="shop-form">
          <div class="input-row">
            <input type="text" id="shop-input" placeholder="What to buy?" required />
            <select id="shop-category" aria-label="Category">
              <option value="grocery">Grocery</option>
              <option value="watsons">Watsons / Pharmacy</option>
              <option value="mrdiy">MRDIY</option>
              <option value="online">Online</option>
              <option value="etc">Etc</option>
            </select>
            <button type="submit" id="shop-add-btn">Add</button>
          </div>
        </form>

        <div class="shop-filters">
          <button class="shop-filter-btn active" data-cat="all">All</button>
          <button class="shop-filter-btn" data-cat="grocery">Grocery</button>
          <button class="shop-filter-btn" data-cat="watsons">Watsons</button>
          <button class="shop-filter-btn" data-cat="mrdiy">MRDIY</button>
          <button class="shop-filter-btn" data-cat="online">Online</button>
          <button class="shop-filter-btn" data-cat="etc">Etc</button>
        </div>

        <input type="text" id="shop-search" class="search-input" placeholder="Search shopping items..." aria-label="Search shopping items" />

        <div id="shopping-list" class="shopping-list">
          <div class="loading">Loading shopping items...</div>
        </div>

        <div class="shop-stats stats">
          <span id="shop-count">0 items</span>
          <span id="shop-bought-count"></span>
          <button id="clear-bought" class="clear-btn">Clear bought</button>
        </div>
      </div>

      <div id="calendar-section" style="display: none">
        <div class="cal-nav">
          <button id="cal-prev" class="cal-nav-btn" aria-label="Previous month">←</button>
          <span id="cal-title" class="cal-title"></span>
          <button id="cal-next" class="cal-nav-btn" aria-label="Next month">→</button>
        </div>
        <div class="cal-grid" id="cal-grid">
          <div class="cal-day-header">Sun</div>
          <div class="cal-day-header">Mon</div>
          <div class="cal-day-header">Tue</div>
          <div class="cal-day-header">Wed</div>
          <div class="cal-day-header">Thu</div>
          <div class="cal-day-header">Fri</div>
          <div class="cal-day-header">Sat</div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="tab active" data-tab="todo" id="tab-todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="nav-label">TODO</span>
      </button>
      <button class="tab" data-tab="shopping" id="tab-shopping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h10.5l2-7H6.5"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <span class="nav-label">SHOPPING</span>
      </button>
      <button id="float-add-btn" aria-label="Add task">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="calendar" id="tab-calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="nav-label">CALENDAR</span>
      </button>
    </nav>

    <div id="edit-modal" class="modal-overlay" style="display:none">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Edit Task</h2>
          <button class="modal-close" id="edit-close" aria-label="Close">✕</button>
        </div>
        <input type="text" id="edit-input" placeholder="Task title" aria-label="Task title">
        <div class="modal-date-row">
          <label for="edit-date">Due date</label>
          <input type="date" id="edit-date" aria-label="Due date">
        </div>
        <p class="modal-hint">Tap a quadrant to change</p>
        <div class="modal-quadrants" id="edit-quadrants">
          <button class="modal-quadrant q1" data-tag="!ui"><span class="mq-title">Do First</span><span class="mq-sub">Urgent &amp; Important</span></button>
          <button class="modal-quadrant q2" data-tag="!nui"><span class="mq-title">Schedule</span><span class="mq-sub">Not Urgent &amp; Important</span></button>
          <button class="modal-quadrant q3" data-tag="!uni"><span class="mq-title">Delegate</span><span class="mq-sub">Urgent &amp; Not Important</span></button>
          <button class="modal-quadrant q4" data-tag=""><span class="mq-title">Eliminate</span><span class="mq-sub">Not Urgent &amp; Not Important</span></button>
        </div>
        <button class="edit-save-btn" id="edit-save">Save</button>
      </div>
    </div>

    <div id="add-modal" class="modal-overlay" style="display:none">
      <div class="modal-card">
        <div class="modal-header">
          <h2>New Task</h2>
          <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
        </div>
        <input type="text" id="modal-input" placeholder="What needs to be done?" aria-label="New task title">
        <p class="modal-hint">Tap a quadrant to add</p>
        <div class="modal-date-row" style="display:none">
          <label for="modal-date">Due date</label>
          <input type="date" id="modal-date" aria-label="Due date">
        </div>
        <div class="modal-quadrants">
          <button class="modal-quadrant q1" data-tag="!ui"><span class="mq-title">Do First</span><span class="mq-sub">Urgent &amp; Important</span></button>
          <button class="modal-quadrant q2" data-tag="!nui"><span class="mq-title">Schedule</span><span class="mq-sub">Not Urgent &amp; Important</span></button>
          <button class="modal-quadrant q3" data-tag="!uni"><span class="mq-title">Delegate</span><span class="mq-sub">Urgent &amp; Not Important</span></button>
          <button class="modal-quadrant q4" data-tag=""><span class="mq-title">Eliminate</span><span class="mq-sub">Not Urgent &amp; Not Important</span></button>
        </div>
      </div>
    </div>

    <div id="stats-modal" class="modal-overlay" style="display:none">
      <div class="modal-card modal-card-wide">
        <div class="modal-header">
          <h2>Stats Dashboard</h2>
          <button class="modal-close" id="stats-close" aria-label="Close">✕</button>
        </div>
        <div class="stats-content" id="stats-content">
          <div class="loading">Loading stats...</div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
